apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    app: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      terminationGracePeriodSeconds: 30
      enableServiceLinks: false
      containers:
        - name: worker
          image: keda-worker:v1
          imagePullPolicy: IfNotPresent
          env:
            - name: REDIS_HOST
              value: redis
            - name: REDIS_PORT
              value: "6379"
            - name: QUEUE_NAME
              value: jobs
            - name: WORK_ITERATIONS
              value: "1000000"
          ports:
            - name: metrics
              containerPort: 8000
          resources:
            requests:
              cpu: 500m
              memory: 64Mi
            limits:
              cpu: 1000m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - "import os,time,sys; sys.exit(0 if time.time()-os.path.getmtime('/tmp/heartbeat')<30 else 1)"
            initialDelaySeconds: 10
            periodSeconds: 10